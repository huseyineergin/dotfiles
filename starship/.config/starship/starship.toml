"$schema" = "https://starship.rs/config-schema.json"

format = """
${custom.user_host}\
[](fg:color_blue_slate bg:color_blue_dark)\
$directory\
[](fg:color_blue_dark bg:color_blue_deep)\
$git_branch\
$git_status\
[](fg:color_blue_deep)\
\n$character
"""

# https://lospec.com/palette-list/aerugo
palette = "aerugo"

[palettes.aerugo]
color_blue_slate = "#64a1c2"
color_blue_dark = "#466480"
color_blue_deep = "#2f485c"

[custom.user_host]
command = "printf '%s@%s' $USER $(hostname -s)"
when = true
style = "bg:color_blue_slate"
format = "[ $output ]($style)"

[directory]
style = "bg:color_blue_dark"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bg:color_blue_deep"
format = "[ $branch ]($style)"

[git_status]
style = "bg:color_blue_deep"
format = "[$all_status$ahead_behind ]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:color_blue_deep"
format = "[ $time ]($style)"

[character]
success_symbol = "❯"
error_symbol = "✘"
vimcmd_symbol = "❮"
